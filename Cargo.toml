[package]
name = "relay-rover"
version = "0.1.1"
edition = "2024"
description = "High-performance, zero-LLM deterministic email intelligence, classification, and entity extraction engine for Relay Mail."
license = "MIT"
readme = "README.md"
repository = "https://github.com/RelayHQX/rover"
homepage = "https://blogs.relaymail.online/blog/rover"
documentation = "https://docs.rs/relay-rover"
authors = ["Relay Team <engineering@relaymail.online>"]
keywords = ["email", "regex", "intelligence", "extraction", "wasm"]
categories = ["text-processing", "parser-implementations", "wasm"]
exclude = [
    "packages",
    "scratch",
    "scripts",
    "test_rover.js",
    "sample_5_types.json",
    "TEST_RESULTS.md",
    "tests/test_react_native_parity.js",
    "data",
]

[lib]
crate-type = ["cdylib", "rlib", "staticlib"]

[dependencies]
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
chrono = { version = "0.4.45", features = ["serde"] }
rust_decimal = { version = "1.36", features = ["serde-with-str"] }
anyhow = "1.0.104"
rayon = "1.10.0"
wasm-bindgen = { version = "0.2.130", optional = true }
uniffi = { version = "0.32.2", default-features = false }

[build-dependencies]
uniffi = { version = "0.32.2", features = ["build"] }

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["cli"]

[features]
default = []
wasm = ["dep:wasm-bindgen"]
cli = ["uniffi/cli"]

[lints.rust]
unsafe_attr_outside_unsafe = "allow"
