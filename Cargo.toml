[package]
name = "relay-rover"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
chrono = { version = "0.4.44", features = ["serde"] }
rust_decimal = { version = "1.36", features = ["serde-with-str"] }
anyhow = "1.0.104"
rayon = "1.10.0"
wasm-bindgen = { version = "0.2.130", optional = true }

[features]
default = []
wasm = ["dep:wasm-bindgen"]
